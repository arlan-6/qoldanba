name = "qoldanba-reminders"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_TIMEZONE = "Asia/Almaty"
PUSH_CLASS_LEAD_MINUTES = "15"
PUSH_CLASS_WINDOW_MINUTES = "5"
PUSH_DEADLINE_LEAD_MINUTES = "60,1440"
PUSH_DEADLINE_WINDOW_MINUTES = "5"
